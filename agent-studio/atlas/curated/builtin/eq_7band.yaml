  - id: input_gain
    name: Input Gain
    section: Gain
    role: pre-EQ level trim
    unit: dB
    does: Gain applied before the EQ sections, in dB (summed with Output into one smoothed gain stage).
    musical_use: Trim level before heavy boosts, or after bypass-comparison, to keep the output level
      matched.
    interactions:
      - 'Same effect as Output Gain in this implementation: both are summed into a single gain after the
        filters; use either, not both, to compensate.'
    safe_range:
      - -12.0
      - 12.0
