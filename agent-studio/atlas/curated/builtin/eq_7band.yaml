# Curated knowledge for the built-in plugin `eq_7band` (patch for `atlas merge`).
# Every value was read from eq.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: 'Seven-section parametric equaliser: high-pass filter, low shelf, three peaking bells (low-mid,
  mid, high-mid), high shelf and low-pass filter, with input and output gain. Filters are biquads whose
  coefficients are smoothed (20 ms) when parameters move.'
signal_flow: Input gain -> optional HPF (6/12/18/24 dB/oct) -> low shelf -> low-mid bell -> mid bell ->
  high-mid bell -> high shelf -> optional LPF (6/12/18/24 dB/oct) -> output gain. A shelf or bell with
  exactly 0 dB gain is bypassed. Sections run in series on every channel (no stereo linking differences).
modes:
  - name: HPF/LPF slope
    description: The two pass filters each pick 6 dB/oct (one-pole), 12 dB/oct (Butterworth biquad), 18
      dB/oct (one-pole plus a Q=1 biquad) or 24 dB/oct (two cascaded Butterworth biquads).
  - name: Band bypass
    description: Each of the five EQ bands is bypassed whenever its gain is exactly 0 dB; the pass filters
      are bypassed while their on-switch is off.
