# Curated knowledge for the built-in plugin `drum_synth` (patch for `atlas merge`).
# Every value was read from drums.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: 'Fully synthesised 24-voice drum kit on a General-MIDI-style note map: kick (35, 36), snare (38,
  40), clap (37, 39), closed hat (42, 44), open hat (46), toms (41/43, 45, 47/48, 50), crash (49, 57)
  and ride (51, 59). Notes outside the map are ignored; note-off does nothing (hits play out). Output
  is mono, copied to all channels.'
signal_flow: 'Each hit is a voice: kick/toms are a sine with pitch-envelope sweep plus a short filtered
  noise click; snare is a pitched sine body plus high-passed noise; clap is three quick filtered noise
  bursts plus a tail; hats and cymbals are six inharmonic square oscillators plus noise through high-pass
  filters. Hit level scales linearly with MIDI velocity. Voices sum x 0.5 -> Level. Closed hat chokes
  open hat (15 ms). All per-instrument parameters are read when a note is triggered, so changing them
  affects the next hit, not ringing ones; only Level is live.'
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/drums.rs:28
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/drums.rs:337
    confidence: 0.95
params:
  - id: level
    name: Level
    section: Output
    role: kit output level
    unit: dB
    does: Output level of the whole kit, -48 to +6 dB (default -6); the only parameter applied to already-sounding
      voices.
    musical_use: Set for mix headroom.
    interactions:
      - All other parameters are latched at note-on and do not change notes already ringing.
    safe_range:
      - -24.0
      - 0.0
    automatable: true
