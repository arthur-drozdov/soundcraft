# Curated knowledge for the built-in plugin `pitch_shifter` (patch for `atlas merge`).
# Every value was read from pitch.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: Realtime granular pitch shifter (two crossfaded read taps sweeping a 50 ms delay window, a rotating-tape-head
  design) with semitone and cent controls and dry/wet mix. Reports latency of half the window (about 25
  ms).
signal_flow: Input -> 50 ms delay line -> two read taps whose delay sweeps at (1 - ratio) per sample,
  crossfaded with sine-squared gains (ratio = 2^((semitones + cents/100)/12)) -> wet; dry is read from
  the window midpoint to stay time-aligned -> dry/wet mix.
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/pitch.rs:16
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/pitch.rs:89
    confidence: 0.95
params:
  - id: semitones
    name: Semitones
    section: Pitch
    role: coarse pitch shift
    unit: semitones
    does: Pitch shift in semitones, -24 to +24.
    musical_use: +-12 for octave effects; +-7 for harmony layers.
    interactions:
      - Added to Fine to give the total shift.
      - Large shifts and low-pitched material expose granular artefacts.
    safe_range:
      - -12.0
      - 12.0
    automatable: true
