  - id: size
    name: Size
    section: Tail
    role: room/plate size
    unit: percent
    does: Scales all internal delay-line lengths from 0.35x (0%) to 1.6x (100%); also changes echo density
      and modal character.
    musical_use: Small for tight ambience; large for hall-like spaciousness.
    interactions:
      - 'Smoothed over 200 ms: automating or changing it live makes the tail glide and sound pitch-shifted.'
      - Decay gains are recomputed so RT60 is held across Size changes.
    safe_range:
