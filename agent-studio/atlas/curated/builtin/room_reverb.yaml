    section: Tail
    role: high-frequency damping
    unit: Hz
    does: Cutoff of a one-pole low-pass inside the feedback loop, 1-20 kHz (log); lower values make the
      tail darker and shorter in the highs.
    musical_use: 4-8 kHz for natural rooms; 10 kHz+ for bright plates.
    interactions:
      - 'Interacts with Decay: low damping frequencies make high frequencies die faster than the nominal
        RT60.'
