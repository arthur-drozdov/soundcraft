# Curated knowledge for the built-in plugin `room_reverb` (patch for `atlas merge`).
# Every value was read from reverb.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: 'Room Reverb: an 8-line feedback delay network reverb tuned to longer, sparser delays (23-57
  ms base lines) for a natural room character, slower 0.7 Hz modulation. Defaults: Mix 25%, Pre-Delay
  10 ms, Decay 1.2 s, Damping 6 kHz, Diffusion 70%.'
signal_flow: Per-side pre-delay (up to 250 ms) -> 4 Schroeder allpass diffusers (coefficient 0.7 x Diffusion)
  -> 8 delay lines mixed by an orthogonal Hadamard matrix with per-line RT60 gains and an in-loop one-pole
  HF damping filter, lines gently modulated -> wet taps combined to left/right -> low-cut high-pass ->
  mid/side width -> linear dry/wet mix. A mono input is fed to both sides and the wet output is the mid
  signal.
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/reverb.rs:50
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/reverb.rs:264
    confidence: 0.95
params:
  - id: mix
    name: Mix
    section: Output
    role: dry/wet blend
    unit: percent
    does: Blend of dry (0) and reverb (100) signal; linear crossfade.
    musical_use: 10-25% for subtle ambience on a track; 100% when used on an aux/send.
    interactions:
      - On a send/aux use 100%; on an insert, higher values push the source back in the mix.
    safe_range:
      - 0.0
      - 60.0
    automatable: true
