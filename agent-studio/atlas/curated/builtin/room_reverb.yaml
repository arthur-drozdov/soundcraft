  - id: pre_delay
    name: Pre-Delay
    section: Early
    role: pre-delay
    unit: ms
    does: Delay before the signal enters the reverb, 0-250 ms (smoothed over 100 ms).
    musical_use: 20-40 ms keeps vocals and snares clear of the tail; tempo-matched values add rhythm.
    interactions:
      - Adds to the tail length reported to the host.
      - Changing it on playing audio sweeps the delay and can produce pitch artefacts.
