# Curated knowledge for the built-in plugin `rectifier` (patch for `atlas merge`).
# Every value was read from harmonic.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: Half- or full-wave rectifier for octave-up and distorted harmonic content, with DC removal, dry/wet
  mix and output trim.
signal_flow: 'Input -> rectify (Half Wave: max(x, 0); Full Wave: |x|) -> DC blocker (10 Hz) -> dry/wet
  mix -> output gain.'
modes:
  - name: Half Wave
    description: Keeps only the positive half-cycles (max(x, 0)); the fundamental stays and many harmonics
      are added.
  - name: Full Wave
    description: Takes the absolute value; doubles the apparent frequency (octave up) and removes the
      fundamental for pure sources.
