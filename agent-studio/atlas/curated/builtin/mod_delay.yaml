# Curated knowledge for the built-in plugin `mod_delay` (patch for `atlas merge`).
# Every value was read from modulation.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: Feedback delay with up to 2 s of delay time, a modulated delay line (chorus-like movement up
  to 5 ms) and a low-pass filter in the feedback path. Time is set in milliseconds only (no tempo sync).
signal_flow: Input -> delay line (cubic-interpolated read at Time + LFO modulation) -> one-pole low-pass
  (LPF) -> output wet; the low-passed wet signal is fed back (Feedback, can be negative) into the line
  along with the dry input. Output = dry x (1-Mix) + wet x Mix. Right channel LFO phase is offset by a
  quarter cycle.
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/modulation.rs:28
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/modulation.rs:116
    confidence: 0.95
params:
  - id: time
    name: Time
    section: Delay
    role: delay time
    unit: ms
    does: Delay time between repeats, 1 ms to 2 s (log), smoothed over 120 ms so changes glide.
    musical_use: 'Compute from tempo manually: 60000/BPM ms per quarter note.'
    interactions:
      - Changing it while audio plays causes a pitch-bend effect on the repeats.
      - Tail length is Time x number of repeats until feedback decays 60 dB.
    safe_range:
      - 20.0
      - 1500.0
    automatable: true
