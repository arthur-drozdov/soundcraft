  - id: feedback
    name: Feedback
    section: Delay
    role: regeneration amount
    unit: percent
    does: Amount of the wet signal fed back, -99 to +99%; negative values invert polarity of each repeat.
    musical_use: 20-40% for a few repeats; higher for washes.
    interactions:
      - Near +-99% repeats nearly never decay and build up.
      - The LPF filters each pass, so repeats get darker.
    safe_range:
