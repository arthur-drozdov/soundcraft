# Curated knowledge for the built-in plugin `signal_generator` (patch for `atlas merge`).
# Every value was read from utility.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: 'Test-tone and noise generator that replaces its input with a sine, square, saw, triangle, white
  noise or pink noise at a set level. Not a processor: input audio is discarded.'
signal_flow: Oscillator (waveform at Frequency) x Level -> written identically to every output channel;
  the incoming audio is ignored.
modes:
  - name: Sine
    description: Generates a sine signal.
  - name: Square
    description: Generates a square signal.
  - name: Saw
    description: Generates a saw signal.
  - name: Triangle
    description: Generates a triangle signal.
  - name: White Noise
    description: Generates a white noise signal.
  - name: Pink Noise
    description: Generates a pink noise signal.
