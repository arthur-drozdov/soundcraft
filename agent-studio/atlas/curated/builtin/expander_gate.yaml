  - id: ratio
    name: Ratio
    section: Gain Computer
    role: expansion ratio
    unit: ratio
    does: Expansion ratio, log taper 1:1 to 100:1; reduction in dB grows by (ratio-1) per dB below threshold.
    musical_use: 100:1 is a hard gate; 2:1-4:1 is a soft expander.
    interactions:
      - At 1:1 no expansion happens regardless of other settings.
      - Range limits the maximum reduction.
    safe_range:
