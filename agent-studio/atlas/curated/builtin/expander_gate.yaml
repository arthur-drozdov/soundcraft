# Curated knowledge for the built-in plugin `expander_gate` (patch for `atlas merge`).
# Every value was read from dynamics.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: Stereo-linked downward expander / noise gate with ratio, range, attack, hold and release.
signal_flow: 'Detector = loudest channel''s absolute sample with a 5 ms peak-hold decay -> level in dB
  vs Threshold: below it, gain reduction = (Threshold - level) x (Ratio - 1), capped at Range -> hold
  timer keeps the gate open Hold ms after the level last exceeded Threshold -> attack (opening) / release
  (closing) smoothing -> same gain applied to all channels. No sidechain filter and no lookahead.'
modes:
  - name: Gate
    description: 'High ratio (default 100:1) and large range: closes fully below threshold.'
  - name: Expander
    description: 'Low ratio (e.g. 2:1) and/or small range: gentle downward expansion that lowers noise
      without chatter.'
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/dynamics.rs:212
    confidence: 0.95
