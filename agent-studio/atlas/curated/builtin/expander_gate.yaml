    ref: crates/dsp/src/plugins/dynamics.rs:271
    confidence: 0.93
params:
  - id: threshold
    name: Threshold
    section: Detector
    role: gate open threshold
    unit: dB
    does: Level below which the signal is attenuated, -80 to 0 dB.
    musical_use: Set just above the noise floor/bleed level and below the wanted signal's quiet parts.
    interactions:
      - Too high chops note tails; Hold and Release determine how tails survive.
    safe_range:
      - -70.0
      - -20.0
