# Curated knowledge for the built-in plugin `saturator` (patch for `atlas merge`).
# Every value was read from harmonic.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: Smooth tanh waveshaper saturator with drive, asymmetry (even harmonics), a tone low-pass, dry/wet
  mix and output trim. The curve is normalised so a full-scale input still peaks near full scale at any
  drive.
signal_flow: Input -> tanh(drive x x + bias) - tanh(bias), normalised by 1/(tanh(drive + bias) - tanh(bias))
  -> DC blocker (10 Hz, only when Asymmetry > 0) -> one-pole low-pass at Tone (bypassed at 20 kHz) ->
  dry/wet mix -> output gain. Not oversampled, so high drive can alias.
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/harmonic.rs:15
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/harmonic.rs:95
    confidence: 0.95
params:
  - id: drive
    name: Drive
    section: Saturation
    role: input drive
    unit: dB
    does: Gain into the tanh shaper, 0-36 dB; more drive means more harmonics and a flatter waveform.
    musical_use: 2-8 dB for subtle warmth; 15+ dB for obvious distortion.
    interactions:
      - Output level stays near-constant (the curve is normalised), so Output rarely needs compensating.
      - 'No oversampling: very high drive on bright sources can alias.'
    safe_range:
      - 0.0
      - 18.0
    automatable: true
