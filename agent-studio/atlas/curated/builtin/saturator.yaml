  - id: bias
    name: Asymmetry
    section: Saturation
    role: DC bias / even harmonics
    unit: percent
    does: Adds a bias (0-0.5 of full scale) before the shaper so positive and negative halves clip differently,
      creating even harmonics; DC is blocked afterwards.
    musical_use: 10-40% for tube-like warmth.
    interactions:
      - Enables a 10 Hz DC blocker in the signal path.
    safe_range:
      - 0.0
      - 60.0
    automatable: true
