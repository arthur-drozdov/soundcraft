  - id: sample_rate
    name: Sample Rate
    section: Crush
    role: decimation rate
    unit: Hz
    does: Rate at which input samples are held, 500 Hz-48 kHz (log); values at or above the host rate
      do nothing.
    musical_use: 8-16 kHz for retro; below 4 kHz is extreme.
    interactions:
      - The host rate acts as an upper bound (no effect when equal or higher).
      - 'No anti-alias filter: lower rates fold harmonics back as inharmonic noise.'
    safe_range:
