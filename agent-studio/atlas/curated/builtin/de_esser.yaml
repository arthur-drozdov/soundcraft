# Curated knowledge for the built-in plugin `de_esser` (patch for `atlas merge`).
# Every value was read from dynamics.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: 'Dynamic-EQ de-esser: a high-pass sidechain detects sibilance and a high shelf dips by up to
  Range dB while the sibilant level exceeds Threshold. At rest the shelf is flat.'
signal_flow: 'Detector: high-pass at Freq (12 dB/oct) -> loudest-channel level -> 0.5 ms attack / 60 ms
  release envelope -> gain reduction = (envelope dB - Threshold) clamped to 0..Range -> a high-shelf at
  0.8 x Freq (Q 0.8) cut by that amount, updated every 16 samples. In Listen mode the output is the detector
  (high-passed) signal instead.'
modes:
  - name: Process
    description: 'Listen off: the audio passes through the dynamic high shelf.'
  - name: Listen
    description: 'Listen on: outputs the high-passed detector signal so the sibilance band can be tuned
      by ear.'
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/dynamics.rs:342
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/dynamics.rs:430
    confidence: 0.95
  modes:
    source: source
    ref: crates/dsp/src/plugins/dynamics.rs:430
    confidence: 0.93
params:
  - id: freq
    name: Frequency
    section: Detector
    role: sibilance centre
    unit: Hz
    does: High-pass corner of the detector and basis of the shelf corner (shelf at 0.8 x Freq), log taper
      2-16 kHz.
    musical_use: 5-8 kHz for most voices; higher for female or bright vocals.
    interactions:
      - Shelf and detector both move with this control.
      - The reduction is a shelf, so everything above the corner is dipped, not just a narrow band.
    safe_range:
      - 3000.0
      - 12000.0
    automatable: true
