# Curated knowledge for the built-in plugin `channel_strip` (patch for `atlas merge`).
# Every value was read from strip.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: Channel strip combining input trim, expander/gate, compressor and a 7-band-EQ-derived section
  (HPF, low shelf, one mid bell, high shelf) with output trim, each stage switchable.
signal_flow: Input gain -> Gate (if Gate on) -> Compressor (if Comp on) -> EQ (if EQ on; HPF, low shelf,
  mid bell with Q, high shelf) -> output gain. The gate and compressor reuse the Expander/Gate and Compressor/Limiter
  engines (gate ratio 100:1, attack 0.5 ms, hold 50 ms; compressor knee 6 dB, no sidechain HPF or lookahead).
  The gain reduction meter shows gate plus compressor reduction.
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/strip.rs:34
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/strip.rs:162
    confidence: 0.95
