  - id: ceiling
    name: Ceiling
    section: Output
    role: output ceiling
    unit: dB
    does: Maximum output sample peak, -30 to 0 dB; applied immediately (not smoothed) as a hard guarantee.
    musical_use: -1.0 to -0.3 dB leaves headroom for codecs and inter-sample peaks (this is a sample-peak,
      not true-peak, limiter).
    interactions:
      - Does not influence the amount of limiting; only the final level.
    safe_range:
      - -3.0
      - -0.1
