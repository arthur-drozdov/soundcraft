params:
  - id: bits
    name: Bit Depth
    section: Requantise
    role: target word length
    unit: choice
    does: 'Target bit depth: 16, 20 or 24 (choice index 0..2).'
    musical_use: 16 for CD-format masters; leave the plugin last in the chain.
    interactions:
      - Should be the last processor; any later gain change defeats the dithering.
      - Selecting 24 gives noise far below audibility.
