# Curated knowledge for the built-in plugin `dither` (patch for `atlas merge`).
# Every value was read from utility.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: TPDF dither with requantisation to 16, 20 or 24 bits and optional first-order noise shaping.
  Digital silence stays silent.
signal_flow: 'Input -> (optional error feedback: x - previous error) -> add triangular (TPDF) dither of
  +-1 LSB -> round to the 2^(1 - bits) grid -> clamp to the legal range. Exact zeros bypass quantisation.'
modes:
  - name: Flat TPDF
    description: 'Noise Shaping off: plain triangular dither.'
  - name: Noise-shaped
    description: 'Noise Shaping on: first-order error feedback pushes quantisation noise toward higher
      frequencies.'
provenance:
