    role: knee width
    unit: dB
    does: Width of the soft-knee region around the threshold, 0 (hard) to 24 dB.
    musical_use: 6 dB (default) is smooth; 0 for a more obvious clamp.
    interactions:
      - The knee begins Knee/2 below the threshold, so gain reduction starts earlier than the Threshold
        value suggests.
