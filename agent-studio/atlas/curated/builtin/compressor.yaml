  - id: makeup
    name: Makeup Gain
    section: Output
    role: makeup gain
    unit: dB
    does: Fixed gain added after compression, 0 to 40 dB (not automatic).
    musical_use: Set so the compressed level matches the bypassed level when comparing.
    interactions:
      - Does not track the amount of gain reduction; changing threshold or ratio requires re-adjusting
        it.
      - Can clip the next stage at large values.
    safe_range:
