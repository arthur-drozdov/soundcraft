    ref: crates/dsp/src/plugins/dynamics.rs:118
    confidence: 0.93
params:
  - id: threshold
    name: Threshold
    section: Detector
    role: compression threshold
    unit: dB
    does: Level above which gain reduction starts, -60 to 0 dB (peak, not RMS).
    musical_use: Set so that loud peaks reduce 3-6 dB for gentle control, more for heavy squash.
    interactions:
      - Lower threshold plus higher ratio means more gain reduction; compensate with Makeup.
      - The knee straddles the threshold (half of Knee below, half above).
    safe_range:
      - -40.0
      - -6.0
    automatable: true
    provenance:
