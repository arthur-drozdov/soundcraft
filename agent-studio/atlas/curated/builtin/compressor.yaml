  - id: attack
    name: Attack
    section: Ballistics
    role: gain-reduction attack time
    unit: ms
    does: One-pole time constant (not time-to-full) with which gain reduction increases, 0.01 to 300 ms.
    musical_use: Slow (20-50 ms) lets transients through for punch; fast (<2 ms) tames them.
    interactions:
      - Very fast attack with no lookahead can distort low frequencies.
      - Lookahead lets a short attack act before the peak arrives.
    safe_range:
      - 0.1
      - 100.0
    automatable: true
