# Curated knowledge for the built-in plugin `compressor` (patch for `atlas merge`).
# Every value was read from dynamics.rs in crates/dsp; see README.md.
default_provenance:
  source: source
  confidence: 0.95
summary: Stereo-linked feed-forward compressor/limiter with soft knee, makeup gain, optional sidechain
  high-pass, lookahead (up to 10 ms) and dry/wet mix for parallel compression.
signal_flow: Detector level = loudest channel's absolute sample (after the optional sidechain high-pass,
  which affects detection only) -> log-domain soft-knee gain computer (threshold, ratio, knee) -> attack/release
  smoothing of the gain reduction -> gain applied to the (optionally lookahead-delayed) dry signal, times
  makeup -> dry/wet mix. All channels share one gain so the stereo image does not shift.
modes:
  - name: Compressor
    description: 'Limit switch off: ratio set by the Ratio control, soft knee as set.'
  - name: Limiter
    description: 'Limit switch on: the ratio is forced to 1000:1 and the Ratio control is ignored; threshold,
      knee, attack and release still apply.'
provenance:
  summary:
    source: source
    ref: crates/dsp/src/plugins/dynamics.rs:48
    confidence: 0.95
  signal_flow:
    source: source
    ref: crates/dsp/src/plugins/dynamics.rs:159
    confidence: 0.95
