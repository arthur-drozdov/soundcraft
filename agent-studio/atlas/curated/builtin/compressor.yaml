  - id: ratio
    name: Ratio
    section: Gain Computer
    role: compression ratio
    unit: ratio
    does: Input-over-threshold to output-over-threshold ratio, log taper 1:1 to 100:1.
    musical_use: 2:1-4:1 transparent leveling; 8:1+ for limiting-like control.
    interactions:
      - Ignored while Limit is on (ratio fixed at 1000:1).
      - At 1:1 the plugin does nothing except makeup/mix.
    safe_range:
