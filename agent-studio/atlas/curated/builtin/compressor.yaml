  - id: lookahead
    name: Lookahead
    section: Detector
    role: lookahead delay
    unit: ms
    does: Delays the audio by this many ms (0-10) so the detector sees peaks early; the plugin reports
      the same delay as latency.
    musical_use: 1-5 ms with fast attacks for transparent peak control.
    interactions:
      - Adds latency equal to the setting (compensated by the host's delay compensation).
      - Changing it live moves the delay tap and may click.
    safe_range:
      - 0.0
      - 5.0
    automatable: true
