  - id: mix
    name: Mix
    section: Output
    role: dry/wet blend
    unit: percent
    does: Blend of uncompressed (0) and compressed (100) signal; the dry path is lookahead-aligned.
    musical_use: 30-60 gives parallel (New York style) compression.
    interactions:
      - At 0% the compressor has no effect except latency; Makeup only applies to the wet portion.
    safe_range:
