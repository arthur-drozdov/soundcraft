    - web
  profiled: '2026-10-22'
summary: 'Phaser: a cascade of 2-12 first-order allpass stages whose corner frequency is swept by a sine
  LFO around Center, with feedback and dry/wet mix.'
signal_flow: Input + feedback -> N allpass stages (N = 2, 4, 6, 8 or 12), corner f = Center x 2^(2 x Depth
  x LFO) clamped to 20 Hz..0.45 x sample rate -> output; the last stage output is fed back (Feedback,
  bipolar). Output = dry x (1-Mix) + wet x Mix. Right channel LFO offset by a quarter cycle.
modes:
  - name: Stage count
    description: 'Stages selects 2, 4, 6, 8 or 12 allpass stages: each pair adds one notch, so more stages
      give a more complex, deeper sweep.'
