identity:
  name: EQ 1-Band
  vendor: SoundCraft
  format: builtin
  plugin_id: eq_1band
  version: 0.10.0
  os:
    - macos
    - windows
    - linux
    - freebsd
    - web
  profiled: '2026-10-22'
summary: 'Single-band equaliser: one biquad filter that can be a peaking bell, low/high shelf, high/low-pass,
  notch or band-pass, plus an output gain.'
signal_flow: Input -> one biquad filter (type, frequency, gain, Q) -> output gain. A Peak band with exactly
  0 dB gain is bypassed. For non-peak types the Gain control still feeds the filter design (it only changes
  the shelves; pass, notch and band-pass designs ignore it).
modes:
  - name: Peak
    description: Bell boost/cut at Freq with Gain and Q.
  - name: Low Shelf
    description: Boost/cut everything below Freq by Gain.
  - name: High Shelf
    description: Boost/cut everything above Freq by Gain.
  - name: High Pass
    description: 12 dB/oct Butterworth-style high-pass at Freq with resonance set by Q; Gain is ignored.
  - name: Low Pass
    description: 12 dB/oct low-pass at Freq with resonance set by Q; Gain is ignored.
  - name: Notch
    description: Narrow cut at Freq, width set by Q; Gain is ignored.
  - name: Band Pass
    description: Passes a band around Freq, width set by Q; Gain is ignored.
params:
  - id: type
    host_name: Type
    name: Filter Type
    section: Filter
    role: filter shape selector
    unit: choice
    min: 0.0
    max: 6.0
    default: 0.0
    taper: linear
    choices:
      - Peak
      - Low Shelf
      - High Shelf
      - High Pass
      - Low Pass
      - Notch
      - Band Pass
    does: 'Chooses the filter shape: Peak, Low Shelf, High Shelf, High Pass, Low Pass, Notch or Band Pass
      (indices 0..6).'
    musical_use: Peak for tone shaping, Notch for removing a hum or ring, High/Low Pass for clean-up.
    interactions:
      - Gain only does something for Peak, Low Shelf and High Shelf.
      - Switching type snaps the filter (no smoothing).
    safe_range:
      - 0
      - 6
    automatable: false
