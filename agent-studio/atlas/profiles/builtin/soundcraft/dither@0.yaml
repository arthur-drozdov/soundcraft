identity:
  name: Dither
  vendor: SoundCraft
  format: builtin
  plugin_id: dither
  version: 0.10.0
  os:
    - macos
    - windows
    - linux
    - freebsd
    - web
  profiled: '2026-10-22'
summary: TPDF dither with requantisation to 16, 20 or 24 bits and optional first-order noise shaping.
  Digital silence stays silent.
signal_flow: 'Input -> (optional error feedback: x - previous error) -> add triangular (TPDF) dither of
  +-1 LSB -> round to the 2^(1 - bits) grid -> clamp to the legal range. Exact zeros bypass quantisation.'
modes:
  - name: Flat TPDF
    description: 'Noise Shaping off: plain triangular dither.'
  - name: Noise-shaped
    description: 'Noise Shaping on: first-order error feedback pushes quantisation noise toward higher
      frequencies.'
params:
  - id: bits
    host_name: Bit Depth
    name: Bit Depth
    section: Requantise
    role: target word length
    unit: choice
    min: 0.0
    max: 2.0
    default: 0.0
    taper: linear
    choices:
      - '16'
      - '20'
      - '24'
    does: 'Target bit depth: 16, 20 or 24 (choice index 0..2).'
    musical_use: 16 for CD-format masters; leave the plugin last in the chain.
    interactions:
      - Should be the last processor; any later gain change defeats the dithering.
      - Selecting 24 gives noise far below audibility.
    safe_range:
      - 0
      - 2
