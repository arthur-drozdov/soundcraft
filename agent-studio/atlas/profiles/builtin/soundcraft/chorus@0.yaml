  profiled: '2026-10-22'
summary: 'Stereo chorus: a short delay line (5-30 ms base) swept by a sine LFO by up to 6 ms, mixed with
  the dry signal; optional feedback and stereo phase spread.'
signal_flow: Input -> short delay line read at Delay + Depth x 6 ms x (0.5 + 0.5 sin) (cubic interpolation)
  -> mixed with dry (Mix). Feedback re-injects the delayed signal. The right channel's LFO is offset by
  up to a quarter cycle (Spread).
