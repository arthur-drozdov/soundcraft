summary: Sample-accurate delay of the signal by Delay (ms) plus Samples, up to 1 s plus 10000 samples;
  changes crossfade over 256 samples. Not an AudioSuite (offline) plugin.
signal_flow: Input -> delay line -> tap at (ms converted to samples + Samples) -> output. When the delay
  changes the old and new taps crossfade over 256 samples. 100% wet.
