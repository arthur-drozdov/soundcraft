    role: delay in milliseconds
    unit: ms
    min: 0.0
    max: 1000.0
    default: 0.0
    taper: linear
    does: Delay in ms, 0-1000.
    musical_use: Use for timing alignment between mics or latency compensation by ear.
    interactions:
      - Total delay = Delay (ms) + Samples; capped by the internal buffer.
      - No automatic compensation is reported to the host.
    safe_range:
