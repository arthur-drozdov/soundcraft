    host_name: Mode
    name: Mode
    section: Rectifier
    role: rectification type
    unit: choice
    min: 0.0
    max: 1.0
    default: 1.0
    taper: linear
    choices:
      - Half Wave
      - Full Wave
    does: Selects Half Wave (0) or Full Wave (1, default).
    musical_use: Full Wave for octave-up effects on monophonic sources.
    interactions:
      - Switching mode changes the signal abruptly; set it rather than ramp it.
    safe_range:
      - 0
      - 1
