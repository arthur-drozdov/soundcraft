  profiled: '2026-10-22'
summary: 'Stereo flanger: a very short delay (0.1-10 ms) swept by a sine LFO from (1 - Depth) x Delay
  up to Delay, with bipolar feedback for comb-filter resonances.'
signal_flow: Input -> delay line read at Delay x (1 - Depth x 0.5 x (1 - sin)) (cubic interpolation, minimum
  0.05 ms) -> mixed with dry (Mix); the delayed output feeds back (Feedback, can be negative). Right channel
  LFO offset by a quarter cycle (fixed).
