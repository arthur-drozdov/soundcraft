identity:
  name: Signal Generator
  vendor: SoundCraft
  format: builtin
  plugin_id: signal_generator
  version: 0.10.0
  os:
    - macos
    - windows
    - linux
    - freebsd
    - web
  profiled: '2026-10-22'
summary: 'Test-tone and noise generator that replaces its input with a sine, square, saw, triangle, white
  noise or pink noise at a set level. Not a processor: input audio is discarded.'
signal_flow: Oscillator (waveform at Frequency) x Level -> written identically to every output channel;
  the incoming audio is ignored.
modes:
  - name: Sine
    description: Generates a sine signal.
  - name: Square
    description: Generates a square signal.
  - name: Saw
    description: Generates a saw signal.
  - name: Triangle
    description: Generates a triangle signal.
  - name: White Noise
    description: Generates a white noise signal.
  - name: Pink Noise
    description: Generates a pink noise signal.
params:
  - id: waveform
    host_name: Waveform
    name: Waveform
    section: Oscillator
    role: waveform selector
    unit: choice
    min: 0.0
    max: 5.0
    default: 0.0
    taper: linear
    choices:
      - Sine
      - Square
      - Saw
      - Triangle
      - White Noise
      - Pink Noise
    does: Selects Sine, Square, Saw, Triangle, White Noise or Pink Noise (choice index 0..5).
    musical_use: Sine for level and frequency checks; pink noise for system calibration.
    interactions:
      - Frequency is ignored for the noise waveforms.
      - Switching waveform is abrupt; set it rather than ramp it.
    safe_range:
      - 0
      - 5
    automatable: false
