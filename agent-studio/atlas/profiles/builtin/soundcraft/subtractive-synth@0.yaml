      - Triangle
    does: 'Waveform of oscillator 1: Saw, Square, Sine or Triangle (index 0..3).'
    musical_use: Saw for bright leads/pads, Square for hollow tones, Sine for sub or pure tones.
    interactions:
      - Mixed with Osc 2 by Osc Mix; at 100% Osc Mix this oscillator is silent.
    safe_range:
