identity:
  name: Subtractive Synth
  vendor: SoundCraft
  format: builtin
  plugin_id: subtractive_synth
  version: 0.10.0
  os:
    - macos
    - windows
    - linux
    - freebsd
    - web
  profiled: '2026-10-22'
summary: '16-voice polyphonic subtractive synthesiser: two PolyBLEP oscillators (saw, square, sine or
  triangle) with pitch and detune offset, a resonant 12 dB/oct state-variable low-pass with its own ADSR,
  an amplitude ADSR, optional glide, velocity sensitivity, sustain pedal and +-2 semitone pitch bend.
  Output is mono, copied to all channels.'
signal_flow: 'Per voice: Osc 1 (waveform, note pitch) and Osc 2 (waveform, +Osc 2 Pitch semitones +Osc
  2 Detune cents) mixed by Osc Mix (0% = Osc 1 only, 100% = Osc 2 only) -> low-pass SVF with cutoff =
  Cutoff x 2^(6 octaves x Filter Env/100 x filter envelope), clamped to 20 Hz..0.45 x sample rate -> x
  amp ADSR x velocity scale; voices summed x 0.3 -> Level -> all channels. Voice allocation reuses the
  same note, then a free voice, then steals the quietest unheld voice. Reacts to MIDI sustain pedal (CC64),
  all-notes-off, and pitch bend.'
