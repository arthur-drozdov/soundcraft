identity:
  name: Maximizer
  vendor: SoundCraft
  format: builtin
  plugin_id: maximizer
  version: 0.10.0
  os:
    - macos
    - windows
    - linux
    - freebsd
    - web
  profiled: '2026-10-22'
summary: 'Lookahead brickwall limiter/maximizer: the input is driven up by -Threshold dB and the output
  never exceeds the Ceiling. Fixed 1.5 ms lookahead.'
signal_flow: Input x drive (= -Threshold dB) -> 1.5 ms delay line; peak detector requests ceiling/peak
  gain -> min-hold over the lookahead window with Release recovery -> equal-length moving average ramps
  gain down before the peak -> delayed signal x gain -> hard clamp to +-ceiling. Reports latency of about
  1.5 ms and a gain reduction meter.
params:
  - id: threshold
    host_name: Threshold
    name: Threshold
    section: Input
    role: input drive
    unit: dB
    min: -30.0
    max: 0.0
    default: 0.0
    taper: linear
    does: 'Acts as input drive: the signal is boosted by -Threshold dB (0 to 30 dB) before limiting, so
      lower values are louder.'
    musical_use: Pull down until the gain reduction meter shows 2-6 dB for loudness; watch distortion
      beyond that.
    interactions:
      - The ceiling is fixed regardless of this setting, so more drive means more limiting, not a hotter
        output.
      - 'Behaves oppositely to a compressor threshold: lowering it increases output loudness.'
    safe_range:
      - -12.0
      - 0.0
    automatable: true
