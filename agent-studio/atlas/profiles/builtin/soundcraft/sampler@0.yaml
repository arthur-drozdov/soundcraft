identity:
  name: Sampler
  vendor: SoundCraft
  format: builtin
  plugin_id: sampler
  version: 0.10.0
  os:
    - macos
    - windows
    - linux
    - freebsd
    - web
  profiled: '2026-10-22'
summary: 32-voice sampler that plays one loaded sample across the keyboard (cubic interpolation, also
  converting the sample's own rate to the host rate), with key and velocity ranges, amplitude ADSR, velocity
  sensitivity, sample start, forward or ping-pong looping, and gate or one-shot playback. Silent until
  the host loads a sample.
signal_flow: 'Note-on (inside the key and velocity ranges) -> voice reads the sample from Sample Start
  at a rate of 2^((note - Root Note + Transpose + Fine/100)/12) (without Key Tracking: Transpose + Fine
  only) -> 4-point cubic interpolation -> x amp ADSR x velocity gain x Level -> summed into all channels
  (mono samples are copied to both, stereo samples keep L/R). Sustain pedal and pitch bend are ignored.'
modes:
  - name: Gate
    description: 'Play Mode Gate: a note plays while the key is held and its envelope releases on note-off.'
  - name: One Shot
    description: 'Play Mode One Shot: the sample plays through regardless of note-off; only the sample
      end (or all-notes-off) ends the voice.'
  - name: Loop Off
    description: Plays the sample once and stops at its end.
  - name: Loop Forward
    description: Loops between Loop Start and Loop End, always playing forwards.
  - name: Loop Ping-Pong
    description: Loops between Loop Start and Loop End, reversing direction at each edge.
