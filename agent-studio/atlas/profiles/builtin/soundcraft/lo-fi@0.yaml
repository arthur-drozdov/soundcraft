  profiled: '2026-10-22'
summary: 'Bit crusher and sample-rate reducer with optional noise: a sample-and-hold decimator plus amplitude
  quantisation, without anti-alias filtering.'
signal_flow: Input -> every 1/SampleRate seconds grab a sample, add noise (amount^2 x 0.1 amplitude, uniform)
  and quantise it to 2^(1-bits) steps -> hold until the next grab -> dry/wet mix. No filtering before
  the hold, so aliasing is intentional.
params:
  - id: bits
    host_name: Bit Depth
    name: Bit Depth
    section: Crush
    role: quantiser resolution
    unit: bits
    min: 1.0
    max: 24.0
    default: 8.0
    taper: linear
    does: Number of bits of amplitude resolution, 1-24 (step = 2^(1 - bits)); the value is continuous,
      not rounded.
    musical_use: 10-12 bits for gentle grit; 4-6 for heavy crush.
    interactions:
      - 24 bits is practically transparent.
      - Quantisation noise is correlated with the signal (no dither).
    safe_range:
      - 4.0
      - 24.0
    automatable: true
