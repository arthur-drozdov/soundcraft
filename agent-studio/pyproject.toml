[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-studio"
version = "0.1.0"
description = "Agent Studio: Forge generation service, Forge MCP, Plugin Atlas and SoundCraft client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6",
  "jsonschema>=4",
  "httpx>=0.27",
  "pydantic>=2.5",
  # the SA3 worker venv is uv-managed Python 3.10 (upstream pin); NotRequired
  # lives in typing only from 3.11.
  "typing_extensions>=4.7",
]

[project.optional-dependencies]
forge = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
forge = "forge.cli:main"
forge-mcp = "forge_mcp.server:main"
atlas = "atlas.cli:main"
atlas-mcp = "atlas.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
