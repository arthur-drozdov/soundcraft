# Stage 2: Forge on the DGX Spark with GPU model families.
# Image built by kaniko (forge-build-pod.yaml) → ghcr.io/arthur-drozdov/forge.
# Replaces the CPU-stage pod: same deployment/service names, so the existing
# Tailscale LoadBalancer (forge-forge.tail3eb9a6.ts.net:7700) carries over.
#
# GPU: requests 1 time-sliced nvidia.com/gpu share (the device plugin on this
# cluster caps shared pods at 1 per pod) on spark-4a06; spark-15d6 is cordoned
# behind a qwen.sonnia.ai/dedicated taint. CPU is capped at 4 because 4a06
# already carries ~16 cores of other requests. Workers only ever use one GPU
# at a time, so this costs no functionality — it just serializes jobs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-config
  namespace: forge
data:
  forge.yaml: |
    listen:
      host: 0.0.0.0
      port: 7700
    token_env: FORGE_TOKEN
    insecure_no_auth: false
    data_dir: /data
    retention_days: 30
    uploads:
      max_bytes: 209712000
      max_seconds: 600
    memory_budget_gb: 96
    families:
      testtone:
        enabled: true
      yin:
        enabled: true
      analysis:
        enabled: true
      basicpitch:
        enabled: true
      acestep:
        enabled: true
      sa3:
        enabled: true
      stems:
        enabled: true
      render:
        enabled: true
        options:
          binary: /opt/forge/bin/soundcraft-cli
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-models
  namespace: forge
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-gateway
  namespace: forge
  labels:
    app: forge-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forge-gateway
  template:
    metadata:
      labels:
        app: forge-gateway
    spec:
      automountServiceAccountToken: false
      # GPU device injection on this cluster goes through the nvidia runtime
      # (same as every other GPU workload); without this the container gets
      # NVIDIA_* env vars but no /dev/nvidia* nodes.
      runtimeClassName: nvidia
      nodeSelector:
        sonnia.ai/dgx-spark: "true"
      containers:
        - name: forge
          image: ghcr.io/arthur-drozdov/forge:cpu-gpu-v3
          # The image's USER is forge(999), but setup-venvs.sh ran as root and
          # uv installed the sa3 venv's managed CPython under /root/.local/share
          # (mode 700) — unreadable to 999. Run as root until the Dockerfile
          # sets UV_PYTHON_INSTALL_DIR=/opt/forge/uv-python and the image is
          # rebuilt.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: FORGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forge-token
                  key: FORGE_TOKEN
            - name: FORGE_CONFIG
              value: /etc/forge/forge.yaml
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forge-hf
                  key: HF_TOKEN
            - name: HF_HOME
              value: /data/hf-cache
          ports:
            - name: http
              containerPort: 7700
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7700/v1/health', timeout=5).status==200 else 1)\""]
            periodSeconds: 15
            failureThreshold: 80   # up to 20 min for family worker spawn
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7700/v1/health', timeout=5).status==200 else 1)\""]
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            # Guaranteed QoS required by the cluster's require-guaranteed-qos policy.
            # The GPU device plugin caps shared pods at 1 nvidia.com/gpu each;
            # Forge runs one model on the GPU at a time anyway. 4 cpu / 48Gi
            # sized to spark-4a06's free capacity (2/4 slices, ~4 free cores).
            requests: { cpu: "4", memory: 48Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "4", memory: 48Gi, nvidia.com/gpu: "1" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forge-data
        - name: models
          persistentVolumeClaim:
            claimName: forge-models
      imagePullSecrets:
        - name: ghcr-pull
