# kaniko build for the full Forge image (gateway + GPU family venvs + render + stems).
# Pod runs in the forge-build namespace on spark-4a06 (spark-15d6 is cordoned
# behind a qwen.sonnia.ai/dedicated taint since 2026-10-27). Pushes
# ghcr.io/arthur-drozdov/forge:<tag>; base image pulled from nvcr.io using the
# NGC key — both credentials in secret kaniko-docker-cfg.
# Layer cache lives in the ghcr cache repo (warm) so the local PVC is optional
# speed; cpu is kept low because openclaw/hx workloads saturate the node.
#
# Start with: kubectl apply -f forge-build-pod.yaml   (after secrets exist)
# Watch:      kubectl -n forge-build logs -f kaniko-forge
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kaniko-cache-2
  namespace: forge-build
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: kaniko-forge
  namespace: forge-build
  labels:
    app: kaniko-forge
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: spark-4a06
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:latest
      args:
        - --context=git://github.com/arthur-drozdov/soundcraft.git
        - --dockerfile=agent-studio/deploy/docker/forge.Dockerfile
        - --destination=ghcr.io/arthur-drozdov/forge:cpu-gpu-v2
        - --build-arg=BASE_IMAGE=nvcr.io/nvidia/pytorch:25.11-py3
        - --build-arg=WITH_RENDER=1
        - --build-arg=WITH_STEMS=1
        - --cache=true
        - --cache-dir=/cache
        - --cache-repo=ghcr.io/arthur-drozdov/forge/cache
        - --snapshot-mode=redo
        # The NGC base is ~20GB and a per-CMD redo snapshot of the venv stage
        # OOM-killed the 6Gi container; one whole-rootfs snapshot at the end
        # fits in the memory limit.
        - --single-snapshot
        - --compression=zstd
        - --verbosity=info
      env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker
      volumeMounts:
        - name: docker-cfg
          mountPath: /kaniko/.docker
          readOnly: true
        - name: cache
          mountPath: /cache
      resources:
        # Guaranteed QoS required by the cluster's require-guaranteed-qos policy.
        # 2cpu/12Gi: openclaw/hx workloads hold nearly all of 4a06's cores
        # (memory is plentiful); 12Gi because the redo-snapshot of the venv
        # stage OOM-killed the container at 6Gi.
        requests: { cpu: "2", memory: 12Gi }
        limits: { cpu: "2", memory: 12Gi }
  volumes:
    - name: docker-cfg
      secret:
        secretName: kaniko-docker-cfg
    - name: cache
      persistentVolumeClaim:
        claimName: kaniko-cache-2
