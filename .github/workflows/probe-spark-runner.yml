name: probe-spark-runner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: spark-soundcraft
    steps:
      - name: what am I
        run: |
          echo "runner=$RUNNER_NAME"
          uname -a && nproc && free -g | head -2
          echo "--- docker:"; docker version 2>&1 | head -6 || echo "no docker"
          echo "--- podman:"; podman version 2>&1 | head -4 || echo "no podman"
          echo "--- gpu:"; nvidia-smi 2>&1 | head -5 || echo "no nvidia-smi"
          echo "--- tools:"; for t in git cargo uv pip3 python3 cmake; do command -v $t || echo "missing: $t"; done
