name: probe-spark-runner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: spark-soundcraft
    steps:
      - name: docker daemon?
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-unset}"
          docker info 2>&1 | head -12 || true
          ls -la /run/user/$(id -u)/ 2>&1 | head -8 || true
          ls -la /run/docker.sock /run/containerd/containerd.sock 2>&1 || true
          sg docker -c "docker ps" 2>&1 | head -3 || true
