name: probe-spark-runner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: spark-soundcraft
    steps:
      - name: can we run dockerd?
        run: |
          command -v dockerd && echo "dockerd present" || echo "no dockerd"
          command -v iptables || echo "no iptables"
          grep -E "CapEff" /proc/self/status
          (dockerd --version || true)
          sudo -n true 2>/dev/null && echo "sudo ok" || echo "no sudo"
