name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    uses: ./.github/workflows/ci-gate.yml
    with:
      command: cargo xtask ci
      # Keep the Linux gate leg on Spark; no platform matrix changes.
      os: '["spark-soundcraft"]'
      packages: >-
        build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev libasound2-dev
