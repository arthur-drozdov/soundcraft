# Evaluates the Nix flake (no build, about a minute): `nix build` / `nix develop` stop at evaluation
# when Cargo.lock gains something nix/package.nix can't vendor, and nothing else would notice.
name: Nix

on:
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "nix/**", "Cargo.lock", ".github/workflows/nix.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    # The source reusable job has no runner selector. Keep its no-build
    # all-systems evaluation on Spark; the installer action supports Linux ARM64.
    # Source behavior inspected at storytold/craft-common-actions commit
    # 86bc2ce420c548d7b171874b67814217532a1648.
    name: nix / eval
    runs-on: spark-soundcraft
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Check flake evaluation
        shell: bash
        env:
          NIX_EXTRA_ARGS: "--no-build --all-systems"
        run: |
          if [ -f flake.nix ]; then
            python3 - <<'PY'
          import os
          import shlex

          os.execvp("nix", ["nix", "flake", "check", *shlex.split(os.environ["NIX_EXTRA_ARGS"])])
          PY
          else
            echo "No flake.nix present in this repository; skipping check."
          fi
