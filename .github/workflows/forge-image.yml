name: forge-image

# Build and publish the Forge GPU serving image (agent-studio) to ghcr.io.
# Runs on a GitHub-hosted arm64 runner (the image targets the GB10 Sparks,
# linux/arm64); no cluster resources are used for building.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish"
        default: "cpu-gpu-v3"
        type: string
  push:
    paths:
      - "agent-studio/**"
      - "deploy-k8s/**"
      - ".github/workflows/forge-image.yml"
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: forge-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/forge

jobs:
  build:
    name: build & push (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-studio/deploy/docker/forge.Dockerfile
          platforms: linux/arm64
          build-args: |
            BASE_IMAGE=nvcr.io/nvidia/pytorch:25.11-py3
            WITH_RENDER=1
            WITH_STEMS=1
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag || 'cpu-gpu-v3' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=forge-arm64
          cache-to: type=gha,scope=forge-arm64,mode=max
          push: true
